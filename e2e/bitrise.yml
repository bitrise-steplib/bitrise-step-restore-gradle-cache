format_version: "11"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git

workflows:
  test_gradle:
    envs:
    - TEST_APP_URL: https://github.com/bitrise-io/Bitrise-Android-Sample
    - BRANCH: main
    # Fixed, world-writable Gradle home. The step's cache key is not stack-scoped,
    # so a restore can pull another stack's archive; keeping the home identical and
    # writable on every stack avoids extracting into a previous stack's /root home.
    - GRADLE_USER_HOME: /tmp/bitrise-gradle-home
    before_run:
    - _setup
    steps:
    - change-workdir:
        title: Switch working dir to _tmp
        inputs:
        - path: ./_tmp
    - script:
        title: Clean Gradle caches
        inputs:
        - content: |-
            set -ex
            mkdir -p "$GRADLE_USER_HOME/init.d"
            # Preserve the stack's Gradle mirror init scripts in the custom home.
            cp -a ~/.gradle/init.d/. "$GRADLE_USER_HOME/init.d/" 2>/dev/null || true
            find "$GRADLE_USER_HOME" -mindepth 1 -maxdepth 1 ! -name init.d -exec rm -rf {} +
            rm -rf ./_tmp/.gradle
    - android-build:
        inputs:
        - module: app
        - variant: debug
    - save-cache:
        run_if: "true"
        is_skippable: false
        inputs:
        - key: |-
            {{ .OS }}-{{ .Arch }}-gradle-cache-{{ checksum "**/*.gradle*" "**/gradle-wrapper.properties" "**/gradle.properties" "**/libs.versions.toml" }}
        - paths: |-
            $GRADLE_USER_HOME/caches
            $GRADLE_USER_HOME/wrapper
            .gradle/configuration-cache
        - verbose: "true"
    - script:
        title: Clean Gradle caches
        inputs:
        - content: |-
              set -ex
              # Stop the daemon so it doesn't race with the cleanup below.
              ./gradlew -stop || true
              find "$GRADLE_USER_HOME" -mindepth 1 -maxdepth 1 ! -name init.d -exec rm -rf {} +
              rm -rf ./_tmp/.gradle
    - path::./:
        title: Execute step
        run_if: "true"
        is_skippable: false
        inputs:
        - verbose: "true"
    - android-build:
        title: Build app again
        inputs:
        - module: app
        - variant: debug

  _setup:
    steps:
    - script:
        title: Delete _tmp dir
        inputs:
        - content: rm -rf _tmp
    - git::https://github.com/bitrise-steplib/bitrise-step-simple-git-clone.git:
        inputs:
        - repository_url: $TEST_APP_URL
        - clone_into_dir: ./_tmp
        - branch: $BRANCH
